[package]
name = "scout"
version = "1.0.0"
description = "Repository intelligence and context-pack generator for Kujo ecosystem review."
license = "MIT"
authors = ["Kujolang <contact@kujolang.ai"]
repository = "https://github.com/kujolang/scout"
keywords = ["kujo", "repository", "context", "developer-tools", "dogfood"]
categories = ["developer-tools"]
readme = "README.md"

[package.status]
stage = "production"
stability = "stable"
public_api = true
notes = "Stable local repository-intelligence CLI; security signals require review and this stage is not enterprise certification."

[kujo]
minimum_version = "1.5.0"
entry = "scout.kujo"
sources = ["lib", "."]
includes = ["README.md", "docs", "tests", "examples", "config.json"]
excludes = [".git", "results", "tests/tmp", "node_modules", "dist", "build"]

[build]
command = ""
output = "dist"
artifacts = []
