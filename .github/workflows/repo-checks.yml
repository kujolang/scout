name: Repo Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  KUJO_VERSION: 1.5.0
  KUJO_LINUX_X64_SHA256: cd267f39c1243f6500889fb3678a1a5206ad1ef99c53d7336265ff31267f0675
  KUJO_WINDOWS_X64_SHA256: a96f6ed80fb4e0b116053e2f9dbb8539dfeacf847c46a9e2496f66bdd2b4d1f4

jobs:
  repo-checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository basics
        run: |
          set -euo pipefail
          test -f scout.kujo
          test -f config.json
          test -f README.md

          jq empty config.json
          grep -q "^# Scout" README.md
          grep -q "run scout.kujo" README.md
          ! grep -q "kujoscan.kujo" README.md

          echo "Repo checks passed"

      - name: Install official Kujo release
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/.ci-bin"
          archive="kujo-v${KUJO_VERSION}-linux-x64.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/kujolang/kujo/releases/download/v${KUJO_VERSION}/${archive}" \
            --output "/tmp/${archive}"
          printf '%s  %s\n' "$KUJO_LINUX_X64_SHA256" "/tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C "$GITHUB_WORKSPACE/.ci-bin"

          test "$("$GITHUB_WORKSPACE/.ci-bin/kujo" --version)" = "kujo ${KUJO_VERSION}"
          "$GITHUB_WORKSPACE/.ci-bin/kujo" run --help >/dev/null
          echo "KUJO_BIN=$GITHUB_WORKSPACE/.ci-bin/kujo" >> "$GITHUB_ENV"

      - name: Install schema validation dependency
        run: |
          set -euo pipefail
          test "$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.12"
          python3 -m pip install --only-binary=:all: --require-hashes \
            -r tests/requirements-schema-linux-py312.txt

      - name: Run Scout regression suite (fast path)
        env:
          SCOUT_SKIP_SLOW: "1"
        run: |
          set -euo pipefail
          tests/scripts/run_all_scout_tests.sh

      - name: Verify version consistency and changelog shape
        run: |
          set -euo pipefail
          tests/scripts/check_version_consistency.sh

      - name: Verify documented quick-start on Linux
        run: |
          set -euo pipefail
          tests/scripts/test_install_smoke.sh

      - name: Fixture smoke scan
        run: |
          set -euo pipefail

          rm -rf tests/tmp/ci-smoke
          mkdir -p tests/tmp/ci-smoke

          "$KUJO_BIN" run scout.kujo tests/fixtures/arc001 -o tests/tmp/ci-smoke -d 2 --security-export sarif --kennel-index --kennel-metadata

          out_dir="$(find tests/tmp/ci-smoke -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$out_dir"
          test -f "$out_dir/intelligence.json"
          test -f "$out_dir/scan_manifest.json"
          test -f "$out_dir/index.json"
          test -f "$out_dir/packages/arc001.json"

          echo "Fixture smoke scan passed"

  windows-release-smoke:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install official Kujo release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "kujo-v$env:KUJO_VERSION-windows-x64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archive
          $url = "https://github.com/kujolang/kujo/releases/download/v$env:KUJO_VERSION/$archive"
          Invoke-WebRequest -Uri $url -OutFile $archivePath

          $actual = (Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLowerInvariant()
          if ($actual -ne $env:KUJO_WINDOWS_X64_SHA256) {
            throw "Kujo archive checksum mismatch: $actual"
          }

          $binDir = Join-Path $env:RUNNER_TEMP "scout-kujo-bin"
          Expand-Archive -Path $archivePath -DestinationPath $binDir
          $kujo = Join-Path $binDir "kujo.exe"
          $reportedVersion = (& $kujo --version).Trim()
          if ($reportedVersion -ne "kujo $env:KUJO_VERSION") {
            throw "Unexpected Kujo version: $reportedVersion"
          }
          "KUJO_BIN=$kujo" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run native Windows Scout workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ./tests/scripts/test_windows_contract.ps1 -KujoBin $env:KUJO_BIN
